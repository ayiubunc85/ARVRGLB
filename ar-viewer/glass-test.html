<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glass Material Test — ar02</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
    }
  }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0f; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; }
    #canvas { display: block; width: 100%; height: 100%; }

    .panel {
      position: fixed; top: 16px; right: 16px; width: 280px;
      background: rgba(15,15,25,0.92); backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
      padding: 20px; z-index: 10;
      max-height: calc(100vh - 32px); overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .panel h2 { font-size: 14px; font-weight: 700; margin-bottom: 16px; color: #fff; letter-spacing: 0.5px; }
    .panel h3 { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.3); margin: 14px 0 8px; }
    .panel h3:first-of-type { margin-top: 0; }

    .slider-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .slider-row label { font-size: 11px; color: rgba(255,255,255,0.5); min-width: 80px; }
    .slider-row input[type="range"] { flex: 1; height: 3px; accent-color: #6366f1; }
    .slider-row .val { font-size: 11px; color: rgba(255,255,255,0.65); min-width: 36px; text-align: right; font-variant-numeric: tabular-nums; }

    .color-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .color-row label { font-size: 11px; color: rgba(255,255,255,0.5); min-width: 80px; }
    .color-row input[type="color"] { width: 28px; height: 20px; border: none; border-radius: 4px; cursor: pointer; background: none; }

    .toggle-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .toggle-row label { font-size: 11px; color: rgba(255,255,255,0.5); min-width: 80px; }
    .toggle-row input[type="checkbox"] { accent-color: #6366f1; }

    .presets { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
    .presets button {
      padding: 5px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.7);
      font-size: 11px; font-weight: 500; cursor: pointer; transition: all 0.15s;
    }
    .presets button:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .presets button.active { background: rgba(99,102,241,0.25); border-color: rgba(99,102,241,0.4); color: #a5b4fc; }

    .info-bar {
      position: fixed; top: 16px; left: 16px;
      background: rgba(15,15,25,0.85); backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 10px;
      padding: 12px 16px; z-index: 10;
    }
    .info-bar h1 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .info-bar p { font-size: 11px; color: rgba(255,255,255,0.4); }

    .loading {
      position: fixed; inset: 0; background: #0a0a0f;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 100; transition: opacity 0.4s;
    }
    .loading.hidden { opacity: 0; pointer-events: none; }
    .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.08); border-top-color: #6366f1; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { margin-top: 16px; font-size: 13px; color: rgba(255,255,255,0.4); }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p id="loadingText">Loading ar02 model...</p>
  </div>

  <div class="info-bar">
    <h1>Glass Material Test</h1>
    <p>ar02 — Three.js MeshPhysicalMaterial</p>
  </div>

  <div class="panel" id="panel">
    <h2>Glass Properties</h2>

    <h3>Presets</h3>
    <div class="presets" id="presets">
      <button data-preset="clear" class="active">Clear Glass</button>
      <button data-preset="frosted">Frosted</button>
      <button data-preset="tinted">Tinted</button>
      <button data-preset="crystal">Crystal</button>
      <button data-preset="bottle">Bottle</button>
      <button data-preset="diamond">Diamond</button>
    </div>

    <h3>Transmission</h3>
    <div class="slider-row">
      <label>Transmission</label>
      <input type="range" id="transmission" min="0" max="1" step="0.01" value="1">
      <span class="val" id="transmissionVal">1.00</span>
    </div>
    <div class="slider-row">
      <label>IOR</label>
      <input type="range" id="ior" min="1" max="2.5" step="0.01" value="1.5">
      <span class="val" id="iorVal">1.50</span>
    </div>
    <div class="slider-row">
      <label>Thickness</label>
      <input type="range" id="thickness" min="0" max="5" step="0.05" value="0.5">
      <span class="val" id="thicknessVal">0.50</span>
    </div>

    <h3>Surface</h3>
    <div class="slider-row">
      <label>Roughness</label>
      <input type="range" id="roughness" min="0" max="1" step="0.01" value="0.05">
      <span class="val" id="roughnessVal">0.05</span>
    </div>
    <div class="slider-row">
      <label>Metalness</label>
      <input type="range" id="metalness" min="0" max="1" step="0.01" value="0">
      <span class="val" id="metalnessVal">0.00</span>
    </div>
    <div class="slider-row">
      <label>Clearcoat</label>
      <input type="range" id="clearcoat" min="0" max="1" step="0.01" value="1">
      <span class="val" id="clearcoatVal">1.00</span>
    </div>
    <div class="slider-row">
      <label>CC Roughness</label>
      <input type="range" id="clearcoatRoughness" min="0" max="1" step="0.01" value="0.1">
      <span class="val" id="clearcoatRoughnessVal">0.10</span>
    </div>

    <h3>Reflections</h3>
    <div class="slider-row">
      <label>Reflectivity</label>
      <input type="range" id="reflectivity" min="0" max="1" step="0.01" value="0.5">
      <span class="val" id="reflectivityVal">0.50</span>
    </div>
    <div class="slider-row">
      <label>Specular</label>
      <input type="range" id="specularIntensity" min="0" max="2" step="0.01" value="1">
      <span class="val" id="specularIntensityVal">1.00</span>
    </div>
    <div class="slider-row">
      <label>Env Intensity</label>
      <input type="range" id="envMapIntensity" min="0" max="3" step="0.05" value="1">
      <span class="val" id="envMapIntensityVal">1.00</span>
    </div>

    <h3>Attenuation (Colored Glass)</h3>
    <div class="color-row">
      <label>Color</label>
      <input type="color" id="attenuationColor" value="#ffffff">
      <span class="val" id="attenuationColorVal">#ffffff</span>
    </div>
    <div class="slider-row">
      <label>Distance</label>
      <input type="range" id="attenuationDistance" min="0" max="10" step="0.1" value="0">
      <span class="val" id="attenuationDistanceVal">0.0</span>
    </div>
    <div class="color-row">
      <label>Specular Color</label>
      <input type="color" id="specularColor" value="#ffffff">
      <span class="val" id="specularColorVal">#ffffff</span>
    </div>

    <h3>Opacity Override</h3>
    <div class="slider-row">
      <label>Opacity</label>
      <input type="range" id="opacity" min="0" max="1" step="0.01" value="1">
      <span class="val" id="opacityVal">1.00</span>
    </div>
    <div class="toggle-row">
      <label>Transparent</label>
      <input type="checkbox" id="transparent" checked>
    </div>
    <div class="toggle-row">
      <label>Side</label>
      <select id="side" style="background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; color: #fff; font-size: 11px; padding: 3px 6px;">
        <option value="double">Double Side</option>
        <option value="front">Front Only</option>
        <option value="back">Back Only</option>
      </select>
    </div>

    <h3>Scene</h3>
    <div class="slider-row">
      <label>Exposure</label>
      <input type="range" id="exposure" min="0.2" max="3" step="0.05" value="1">
      <span class="val" id="exposureVal">1.00</span>
    </div>
    <div class="slider-row">
      <label>Env Rotate</label>
      <input type="range" id="envRotate" min="0" max="6.283" step="0.01" value="0">
      <span class="val" id="envRotateVal">0°</span>
    </div>
    <div class="toggle-row">
      <label>Show Skybox</label>
      <input type="checkbox" id="showSkybox">
    </div>
    <div class="toggle-row">
      <label>Wireframe</label>
      <input type="checkbox" id="wireframe">
    </div>
    <div class="toggle-row">
      <label>Original Mat</label>
      <input type="checkbox" id="originalMat">
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

    const canvas = document.getElementById('canvas');
    const loadingEl = document.getElementById('loading');
    const loadingText = document.getElementById('loadingText');

    // Renderer
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    // Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0f);

    // Camera
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 100);
    camera.position.set(2, 1.5, 3);

    // Controls
    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 0.5;
    controls.maxDistance = 20;
    controls.target.set(0, 0.5, 0);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(3, 5, 4);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.setScalar(1024);
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 20;
    dirLight.shadow.camera.left = -4;
    dirLight.shadow.camera.right = 4;
    dirLight.shadow.camera.top = 4;
    dirLight.shadow.camera.bottom = -4;
    dirLight.shadow.bias = -0.0005;
    scene.add(dirLight);

    // Ground plane with checkerboard for transmission visibility
    const checkerSize = 20;
    const checkerCanvas = document.createElement('canvas');
    checkerCanvas.width = checkerCanvas.height = 512;
    const ctx = checkerCanvas.getContext('2d');
    const sq = 32;
    for (let y = 0; y < 512; y += sq) {
      for (let x = 0; x < 512; x += sq) {
        ctx.fillStyle = ((x / sq + y / sq) % 2 === 0) ? '#1a1a2a' : '#252535';
        ctx.fillRect(x, y, sq, sq);
      }
    }
    const checkerTex = new THREE.CanvasTexture(checkerCanvas);
    checkerTex.wrapS = checkerTex.wrapT = THREE.RepeatWrapping;
    checkerTex.repeat.set(checkerSize, checkerSize);
    const groundMat = new THREE.MeshStandardMaterial({ map: checkerTex, roughness: 0.8, metalness: 0.1 });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(checkerSize, checkerSize), groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Environment map via PMREMGenerator
    const pmremGen = new THREE.PMREMGenerator(renderer);
    pmremGen.compileEquirectangularShader();

    // Try loading an HDR first, fall back to procedural
    let envTexture = null;
    async function loadEnvironment() {
      // Try project HDR first
      const hdrPaths = ['/envmaps/outdoor.hdr', '/envmaps/studio_small.hdr', '/envmaps/studio_loft.hdr'];
      for (const path of hdrPaths) {
        try {
          const tex = await new Promise((resolve, reject) => {
            new RGBELoader().load(path, resolve, undefined, reject);
          });
          envTexture = pmremGen.fromEquirectangular(tex).texture;
          tex.dispose();
          scene.environment = envTexture;
          loadingText.textContent = 'Environment loaded, loading model...';
          return;
        } catch {}
      }
      // Procedural fallback
      const envScene = new THREE.Scene();
      const envLight1 = new THREE.DirectionalLight(0xffffff, 2);
      envLight1.position.set(1, 2, 3);
      envScene.add(envLight1);
      const envLight2 = new THREE.DirectionalLight(0x8899ff, 1);
      envLight2.position.set(-2, 1, -1);
      envScene.add(envLight2);
      envScene.add(new THREE.AmbientLight(0xffffff, 0.5));
      envTexture = pmremGen.fromScene(envScene).texture;
      scene.environment = envTexture;
    }

    // Glass material
    const glassMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      metalness: 0,
      roughness: 0.05,
      transmission: 1.0,
      ior: 1.5,
      thickness: 0.5,
      transparent: true,
      opacity: 1,
      clearcoat: 1.0,
      clearcoatRoughness: 0.1,
      reflectivity: 0.5,
      specularIntensity: 1.0,
      specularColor: new THREE.Color(0xffffff),
      envMapIntensity: 1.0,
      side: THREE.DoubleSide,
      attenuationColor: new THREE.Color(0xffffff),
      attenuationDistance: 0,
    });

    // Store original materials for toggle
    const originalMaterials = new Map();
    let modelGroup = null;

    // Load model
    async function loadModel() {
      await loadEnvironment();
      loadingText.textContent = 'Loading ar02 model...';

      const loader = new GLTFLoader();
      const dracoLoader = new DRACOLoader();
      dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/libs/draco/');
      loader.setDRACOLoader(dracoLoader);

      const baseUrl = window.location.origin;
      const modelUrl = baseUrl + '/models/ar02.glb';

      try {
        const gltf = await new Promise((resolve, reject) => {
          loader.load(modelUrl, resolve,
            (progress) => {
              if (progress.total > 0) {
                loadingText.textContent = `Loading... ${Math.round((progress.loaded / progress.total) * 100)}%`;
              }
            },
            reject
          );
        });

        const model = gltf.scene;

        // Measure and center
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);

        // Normalize to ~2m tall, sitting on ground
        const scale = 2 / maxDim;
        model.scale.setScalar(scale);
        model.position.set(-center.x * scale, -box.min.y * scale, -center.z * scale);

        // Store original materials, apply glass
        model.traverse(child => {
          if (child.isMesh) {
            originalMaterials.set(child.uuid, child.material);
            child.material = glassMaterial;
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });

        modelGroup = model;
        scene.add(model);

        // Fit camera
        const scaledBox = new THREE.Box3().setFromObject(model);
        const scaledCenter = scaledBox.getCenter(new THREE.Vector3());
        const scaledSize = scaledBox.getSize(new THREE.Vector3());
        controls.target.copy(scaledCenter);
        const dist = Math.max(scaledSize.x, scaledSize.y, scaledSize.z) * 1.8;
        camera.position.set(
          scaledCenter.x + dist * 0.7,
          scaledCenter.y + dist * 0.5,
          scaledCenter.z + dist * 0.7
        );

        loadingEl.classList.add('hidden');
        dracoLoader.dispose();
      } catch (err) {
        loadingText.textContent = 'Failed to load ar02.glb — make sure the desktop server is running with ar02 model loaded';
        console.error('Model load failed:', err);
      }
    }

    loadModel();

    // Presets
    const presets = {
      clear: { transmission: 1, ior: 1.5, thickness: 0.5, roughness: 0.05, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.1, reflectivity: 0.5, specularIntensity: 1, envMapIntensity: 1, attenuationColor: '#ffffff', attenuationDistance: 0, opacity: 1, specularColor: '#ffffff' },
      frosted: { transmission: 0.9, ior: 1.5, thickness: 0.8, roughness: 0.4, metalness: 0, clearcoat: 0.3, clearcoatRoughness: 0.6, reflectivity: 0.3, specularIntensity: 0.5, envMapIntensity: 0.8, attenuationColor: '#e8e8ff', attenuationDistance: 1, opacity: 1, specularColor: '#ffffff' },
      tinted: { transmission: 0.95, ior: 1.52, thickness: 1.0, roughness: 0.02, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.05, reflectivity: 0.5, specularIntensity: 1, envMapIntensity: 1.2, attenuationColor: '#3366aa', attenuationDistance: 2, opacity: 1, specularColor: '#ffffff' },
      crystal: { transmission: 1, ior: 2.0, thickness: 0.3, roughness: 0, metalness: 0, clearcoat: 1, clearcoatRoughness: 0, reflectivity: 0.9, specularIntensity: 2, envMapIntensity: 1.5, attenuationColor: '#ffffff', attenuationDistance: 0, opacity: 1, specularColor: '#ffffff' },
      bottle: { transmission: 0.95, ior: 1.52, thickness: 2.5, roughness: 0.05, metalness: 0, clearcoat: 0.8, clearcoatRoughness: 0.15, reflectivity: 0.4, specularIntensity: 0.8, envMapIntensity: 1, attenuationColor: '#1a6633', attenuationDistance: 1.5, opacity: 1, specularColor: '#ffffff' },
      diamond: { transmission: 1, ior: 2.42, thickness: 0.2, roughness: 0, metalness: 0, clearcoat: 1, clearcoatRoughness: 0, reflectivity: 1, specularIntensity: 2, envMapIntensity: 2, attenuationColor: '#ffffff', attenuationDistance: 0, opacity: 1, specularColor: '#eeeeff' },
    };

    function applyPreset(name) {
      const p = presets[name];
      if (!p) return;

      document.querySelectorAll('#presets button').forEach(b => b.classList.remove('active'));
      document.querySelector(`[data-preset="${name}"]`)?.classList.add('active');

      for (const [key, val] of Object.entries(p)) {
        const el = document.getElementById(key);
        if (!el) continue;
        if (typeof val === 'string') {
          el.value = val;
        } else {
          el.value = String(val);
        }
        el.dispatchEvent(new Event('input'));
      }
    }

    document.getElementById('presets').addEventListener('click', e => {
      const btn = e.target.closest('[data-preset]');
      if (btn) applyPreset(btn.dataset.preset);
    });

    // Slider/control bindings
    const sliders = [
      'transmission', 'ior', 'thickness', 'roughness', 'metalness',
      'clearcoat', 'clearcoatRoughness', 'reflectivity', 'specularIntensity',
      'envMapIntensity', 'attenuationDistance', 'opacity', 'exposure', 'envRotate'
    ];

    for (const id of sliders) {
      const el = document.getElementById(id);
      const valEl = document.getElementById(id + 'Val');
      el.addEventListener('input', () => {
        const v = parseFloat(el.value);
        if (id === 'envRotate') {
          valEl.textContent = Math.round(v * 180 / Math.PI) + '°';
          scene.environmentRotation = new THREE.Euler(0, v, 0);
          if (scene.background && scene.background.isTexture) {
            scene.backgroundRotation = new THREE.Euler(0, v, 0);
          }
        } else if (id === 'exposure') {
          valEl.textContent = v.toFixed(2);
          renderer.toneMappingExposure = v;
        } else {
          valEl.textContent = v.toFixed(2);
          if (id in glassMaterial) {
            glassMaterial[id] = v;
            glassMaterial.needsUpdate = true;
          }
        }
      });
    }

    // Color inputs
    document.getElementById('attenuationColor').addEventListener('input', e => {
      glassMaterial.attenuationColor.set(e.target.value);
      document.getElementById('attenuationColorVal').textContent = e.target.value;
      glassMaterial.needsUpdate = true;
    });

    document.getElementById('specularColor').addEventListener('input', e => {
      glassMaterial.specularColor.set(e.target.value);
      document.getElementById('specularColorVal').textContent = e.target.value;
      glassMaterial.needsUpdate = true;
    });

    // Toggles
    document.getElementById('transparent').addEventListener('change', e => {
      glassMaterial.transparent = e.target.checked;
      glassMaterial.needsUpdate = true;
    });

    document.getElementById('wireframe').addEventListener('change', e => {
      glassMaterial.wireframe = e.target.checked;
    });

    document.getElementById('showSkybox').addEventListener('change', e => {
      scene.background = e.target.checked && envTexture ? envTexture : new THREE.Color(0x0a0a0f);
    });

    document.getElementById('side').addEventListener('change', e => {
      const sides = { double: THREE.DoubleSide, front: THREE.FrontSide, back: THREE.BackSide };
      glassMaterial.side = sides[e.target.value] || THREE.DoubleSide;
      glassMaterial.needsUpdate = true;
    });

    document.getElementById('originalMat').addEventListener('change', e => {
      if (!modelGroup) return;
      modelGroup.traverse(child => {
        if (child.isMesh) {
          child.material = e.target.checked ? originalMaterials.get(child.uuid) : glassMaterial;
        }
      });
    });

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Render loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
