<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0a0a">
  <title>AR Viewer</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
    }
  }
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f1a;
      color: #fff;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    model-viewer {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background-color: #0f0f1a;
      --poster-color: #0f0f1a;
      --progress-bar-color: #4361ee;
      --progress-bar-height: 3px;
    }
    model-viewer::part(default-ar-button) { display: none; }

    .ar-button {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
      background: #4361ee; border-radius: 16px; padding: 16px 36px;
      font-size: 16px; font-weight: 600; color: white; border: none;
      box-shadow: 0 4px 24px rgba(67,97,238,0.45); z-index: 20;
      display: none; align-items: center; gap: 10px; cursor: pointer;
    }
    .ar-button:active { transform: translateX(-50%) scale(0.96); }
    .ar-button.visible { display: flex; }
    .ar-button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; }

    .loading-screen {
      position: fixed; inset: 0; background: #0a0a0a;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 100; transition: opacity 0.4s ease;
    }
    .loading-screen.hidden { opacity: 0; pointer-events: none; }

    .spinner { width: 48px; height: 48px; border: 3px solid rgba(255,255,255,0.08); border-top-color: #4361ee; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-status { margin-top: 20px; font-size: 14px; color: rgba(255,255,255,0.5); text-align: center; }
    .progress-bar { width: 180px; height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px; margin-top: 16px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: #4361ee; border-radius: 2px; transition: width 0.3s ease; }

    .info-bar {
      position: fixed; top: 0; left: 0; right: 0; padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
      display: flex; align-items: center; justify-content: space-between;
      z-index: 10; opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
    }
    .info-bar.visible { opacity: 1; pointer-events: auto; }
    .model-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; }
    .model-size { font-size: 12px; color: rgba(255,255,255,0.5); }

    .no-ar-notice {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
      background: rgba(30,30,50,0.85); backdrop-filter: blur(12px);
      border-radius: 12px; padding: 14px 24px; font-size: 13px;
      color: rgba(255,255,255,0.65); text-align: center; z-index: 20;
      max-width: 90%; display: none; line-height: 1.4;
    }
    .no-ar-notice.visible { display: block; }

    .error-screen {
      position: fixed; inset: 0; background: #0a0a0a; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      padding: 32px; text-align: center; z-index: 100;
    }
    .error-screen.visible { display: flex; }
    .error-icon { width: 56px; height: 56px; border-radius: 50%; background: rgba(239,68,68,0.1); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; font-size: 24px; }
    .error-screen h2 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    .error-screen p { font-size: 14px; color: rgba(255,255,255,0.5); max-width: 300px; line-height: 1.5; }
    .retry-btn { margin-top: 24px; background: #4361ee; color: #fff; border: none; border-radius: 10px; padding: 12px 28px; font-size: 15px; font-weight: 600; cursor: pointer; }

    /* ── AR Overlay (dom-overlay root during WebXR) ── */
    #arOverlay {
      position: fixed; inset: 0; z-index: 200; display: none;
      pointer-events: none;
    }
    #arOverlay.active { display: block; }

    .ar-guide-bar {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 16px; padding-top: max(16px, env(safe-area-inset-top));
      text-align: center; pointer-events: none;
    }
    .ar-guide-pill {
      display: inline-block; background: rgba(0,0,0,0.7);
      backdrop-filter: blur(10px); border-radius: 12px;
      padding: 10px 20px; font-size: 14px; color: rgba(255,255,255,0.9);
    }
    .ar-close-btn {
      position: fixed; top: 16px; top: max(16px, env(safe-area-inset-top));
      right: 16px; width: 44px; height: 44px; border-radius: 50%;
      background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.5);
      color: white; font-size: 22px; z-index: 210;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; pointer-events: auto;
    }
    .ar-debug {
      position: fixed; bottom: 16px; left: 16px; right: 16px;
      background: rgba(0,0,0,0.7); border-radius: 8px; padding: 8px 12px;
      font-size: 11px; color: rgba(255,255,255,0.7); pointer-events: none;
      font-family: monospace; max-height: 120px; overflow-y: auto;
    }
  </style>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>
<body>

  <div class="loading-screen" id="loading">
    <div class="spinner"></div>
    <p class="loading-status" id="loadingStatus">Connecting…</p>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="error-screen" id="error">
    <div class="error-icon">!</div>
    <h2 id="errorTitle">Could not load model</h2>
    <p id="errorMessage">Check that your phone is on the same WiFi network as the host computer.</p>
    <button class="retry-btn" id="retryBtn">Try again</button>
  </div>

  <div class="info-bar" id="infoBar">
    <span class="model-name" id="modelName"></span>
    <span class="model-size" id="modelSize"></span>
  </div>

  <div class="no-ar-notice" id="noArNotice"></div>

  <button class="ar-button" id="arBtn">
    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
    View in AR
  </button>

  <model-viewer
    id="viewer"
    camera-controls touch-action="pan-y"
    auto-rotate auto-rotate-delay="2000" rotation-per-second="24deg"
    shadow-intensity="1" shadow-softness="0.8" exposure="1"
    environment-image="neutral" interaction-prompt="auto"
    style="visibility: hidden; position: absolute;"
  ></model-viewer>

  <!-- AR DOM overlay (shown during WebXR session) -->
  <div id="arOverlay">
    <div class="ar-guide-bar">
      <span class="ar-guide-pill" id="arGuideText">Move your phone slowly to scan the floor</span>
    </div>
    <button class="ar-close-btn" id="arCloseBtn">&times;</button>
    <div class="ar-debug" id="arDebug"></div>
  </div>

  <!-- ── 3D Preview Logic ── -->
  <script>
    (function () {
      var viewer = document.getElementById('viewer');
      var loading = document.getElementById('loading');
      var loadingStatus = document.getElementById('loadingStatus');
      var progressFill = document.getElementById('progressFill');
      var errorEl = document.getElementById('error');
      var errorTitle = document.getElementById('errorTitle');
      var errorMessage = document.getElementById('errorMessage');
      var retryBtn = document.getElementById('retryBtn');
      var infoBar = document.getElementById('infoBar');
      var modelNameEl = document.getElementById('modelName');
      var modelSizeEl = document.getElementById('modelSize');
      var arBtn = document.getElementById('arBtn');
      var noArNotice = document.getElementById('noArNotice');

      var pathParts = window.location.pathname.split('/');
      var modelId = decodeURIComponent(pathParts[pathParts.length - 1]);

      if (!modelId) { showError('No model specified', 'The URL is missing a model name.'); return; }

      var baseUrl = window.location.origin;
      var glbUrl = baseUrl + '/models/' + encodeURIComponent(modelId) + '.glb';
      var usdzUrl = baseUrl + '/models/' + encodeURIComponent(modelId) + '.usdz';

      // Expose for the AR module
      window.__arModelUrl = glbUrl;

      startLoading();

      retryBtn.addEventListener('click', function () {
        errorEl.classList.remove('visible');
        loading.classList.remove('hidden');
        loading.style.display = '';
        startLoading();
      });

      // AR button — start custom WebXR AR
      arBtn.addEventListener('click', async function () {
        if (typeof window.startCustomAR === 'function') {
          arBtn.classList.remove('visible');
          infoBar.classList.remove('visible');
          try {
            await window.startCustomAR(glbUrl);
          } catch (err) {
            noArNotice.textContent = 'AR failed: ' + (err.message || err);
            noArNotice.classList.add('visible');
            setTimeout(function () { noArNotice.classList.remove('visible'); }, 5000);
          }
          arBtn.classList.add('visible');
          infoBar.classList.add('visible');
        }
      });

      function startLoading() {
        loadingStatus.textContent = 'Connecting…';
        progressFill.style.width = '0%';
        checkServer()
          .then(function () {
            progressFill.style.width = '20%';
            loadingStatus.textContent = 'Fetching model info…';
            return fetchModelInfo();
          })
          .then(function (info) {
            progressFill.style.width = '40%';
            loadingStatus.textContent = 'Loading 3D model…';
            loadModel(info);
          })
          .catch(function (err) { showError(err.title || 'Connection failed', err.message || err); });
      }

      function checkServer() {
        return new Promise(function (resolve, reject) {
          var xhr = new XMLHttpRequest();
          xhr.open('GET', baseUrl + '/api/ping', true);
          xhr.timeout = 5000;
          xhr.onload = function () { xhr.status === 200 ? resolve() : reject({ title: 'Server error', message: 'Status ' + xhr.status }); };
          xhr.onerror = function () { reject({ title: 'Cannot reach server', message: 'Make sure your phone is on the same WiFi network as the host computer.' }); };
          xhr.ontimeout = function () { reject({ title: 'Connection timed out', message: 'The server did not respond.' }); };
          xhr.send();
        });
      }

      function fetchModelInfo() {
        return new Promise(function (resolve, reject) {
          var xhr = new XMLHttpRequest();
          xhr.open('GET', baseUrl + '/api/models/' + encodeURIComponent(modelId), true);
          xhr.timeout = 5000;
          xhr.onload = function () {
            if (xhr.status === 200) resolve(JSON.parse(xhr.responseText));
            else if (xhr.status === 404) reject({ title: 'Model not found', message: '"' + modelId + '" not on server.' });
            else reject({ title: 'Server error', message: 'Could not fetch model info.' });
          };
          xhr.onerror = function () { reject({ title: 'Network error', message: 'Lost connection.' }); };
          xhr.ontimeout = function () { reject({ title: 'Timed out', message: 'Server too slow.' }); };
          xhr.send();
        });
      }

      function loadModel(info) {
        if (info.hasGlb) viewer.setAttribute('src', glbUrl);
        if (info.hasUsdz) viewer.setAttribute('ios-src', usdzUrl);
        viewer.setAttribute('alt', '3D model: ' + modelId);

        var displayName = modelId.replace(/[-_]/g, ' ');
        modelNameEl.textContent = displayName.charAt(0).toUpperCase() + displayName.slice(1);
        modelSizeEl.textContent = (info.glbSizeMB || info.usdzSizeMB || '?') + ' MB';

        viewer.addEventListener('progress', function (e) {
          progressFill.style.width = (40 + e.detail.totalProgress * 60) + '%';
          loadingStatus.textContent = 'Loading… ' + Math.round(e.detail.totalProgress * 100) + '%';
        });

        viewer.addEventListener('load', function onLoad() {
          viewer.removeEventListener('load', onLoad);
          loading.classList.add('hidden');
          viewer.style.visibility = 'visible';
          viewer.style.position = 'static';
          infoBar.classList.add('visible');

          // Check if WebXR AR is available
          setTimeout(async function () {
            var arAvailable = false;
            if (navigator.xr) {
              try { arAvailable = await navigator.xr.isSessionSupported('immersive-ar'); } catch (e) {}
            }
            if (arAvailable) {
              arBtn.classList.add('visible');
            } else {
              noArNotice.textContent = 'AR requires HTTPS and an AR-capable device with Chrome.';
              noArNotice.classList.add('visible');
            }
          }, 300);
        });

        viewer.addEventListener('error', function () {
          showError('Failed to load model', 'The file may be corrupted or unsupported.');
        });

        setTimeout(function () {
          if (!loading.classList.contains('hidden')) {
            showError('Loading timed out', 'Model too large for this connection.');
          }
        }, 120000);
      }

      function showError(title, msg) {
        loading.style.display = 'none';
        arBtn.classList.remove('visible');
        errorTitle.textContent = title;
        errorMessage.textContent = msg;
        errorEl.classList.add('visible');
      }

      var hideTimer;
      viewer.addEventListener('camera-change', function () {
        infoBar.classList.remove('visible');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(function () {
          if (viewer.style.visibility !== 'hidden') infoBar.classList.add('visible');
        }, 2000);
      });
    })();
  </script>

  <!-- ── Custom WebXR AR with Three.js ── -->
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    const overlay = document.getElementById('arOverlay');
    const guideText = document.getElementById('arGuideText');
    const closeBtn = document.getElementById('arCloseBtn');
    const debugEl = document.getElementById('arDebug');
    const viewerEl = document.getElementById('viewer');

    function log(msg) {
      const line = document.createElement('div');
      line.textContent = msg;
      debugEl.appendChild(line);
      debugEl.scrollTop = debugEl.scrollHeight;
    }

    // Global cleanup — called on any exit path
    let cleanupFn = null;

    window.startCustomAR = async function (modelUrl) {
      overlay.classList.add('active');
      debugEl.innerHTML = '';
      guideText.textContent = 'Starting AR…';
      log('Requesting XR session…');

      // ── 1. Request XR session immediately (preserves user gesture) ──
      let session;
      try {
        session = await navigator.xr.requestSession('immersive-ar', {
          optionalFeatures: ['hit-test', 'dom-overlay', 'local-floor'],
          domOverlay: { root: overlay },
        });
      } catch (err) {
        overlay.classList.remove('active');
        throw new Error('XR session: ' + (err.message || err));
      }
      log('XR session started');

      // ── 2. Three.js renderer ──
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 100);
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      renderer.xr.setReferenceSpaceType('local-floor');
      await renderer.xr.setSession(session);
      log('Renderer bound to XR');

      // Hide model-viewer
      viewerEl.style.display = 'none';

      // Lighting
      scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.2));
      const dl = new THREE.DirectionalLight(0xffffff, 0.8);
      dl.position.set(0.5, 1, 0.3);
      scene.add(dl);

      // Reticle
      const reticle = new THREE.Mesh(
        new THREE.RingGeometry(0.08, 0.11, 32).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0x4361ee, side: THREE.DoubleSide })
      );
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      // Model container
      const modelGroup = new THREE.Group();
      modelGroup.visible = false;
      scene.add(modelGroup);

      let placed = false;
      let modelLoaded = false;
      let hitTestSource = null;
      let selectCount = 0;
      let hitCount = 0;

      // ── 3. Hit-test (optional) ──
      try {
        const vSpace = await session.requestReferenceSpace('viewer');
        hitTestSource = await session.requestHitTestSource({ space: vSpace });
        log('Hit-test enabled');
        guideText.textContent = 'Move phone slowly to find the floor';
      } catch (e) {
        log('Hit-test unavailable: ' + e.message);
        guideText.textContent = 'Tap anywhere to place model';
      }

      // ── 4. Place on tap (XR select event) ──
      session.addEventListener('select', function () {
        selectCount++;
        log('select #' + selectCount + ' loaded=' + modelLoaded + ' placed=' + placed + ' reticle=' + reticle.visible);
        if (!modelLoaded || placed) return;

        if (reticle.visible) {
          const pos = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
          modelGroup.position.copy(pos);
          log('Placed at reticle');
        } else {
          const cam = renderer.xr.getCamera();
          const fwd = new THREE.Vector3(0, 0, -2).applyQuaternion(cam.quaternion);
          modelGroup.position.set(cam.position.x + fwd.x, cam.position.y - 1.3, cam.position.z + fwd.z);
          log('Placed in front (no surface)');
        }
        modelGroup.visible = true;
        placed = true;
        reticle.visible = false;
        guideText.textContent = 'Pinch to resize · Drag to rotate';
        setTimeout(() => { guideText.parentElement.style.opacity = '0'; guideText.parentElement.style.transition = 'opacity 1s'; }, 4000);
      });

      // ── 5. Gestures ──
      let touches = {};
      let pinchDist0 = 0, pinchScale0 = 1, lastX = 0;

      overlay.addEventListener('touchstart', e => {
        for (const t of e.changedTouches) touches[t.identifier] = { x: t.clientX, y: t.clientY };
        const k = Object.keys(touches);
        if (k.length === 2 && placed) {
          const a = touches[k[0]], b = touches[k[1]];
          pinchDist0 = Math.hypot(b.x - a.x, b.y - a.y);
          pinchScale0 = modelGroup.scale.x;
        }
        if (k.length === 1 && placed) lastX = touches[k[0]].x;
      }, { passive: true });

      overlay.addEventListener('touchmove', e => {
        for (const t of e.changedTouches) touches[t.identifier] = { x: t.clientX, y: t.clientY };
        const k = Object.keys(touches);
        if (k.length === 2 && pinchDist0 > 0 && placed) {
          const a = touches[k[0]], b = touches[k[1]];
          const d = Math.hypot(b.x - a.x, b.y - a.y);
          modelGroup.scale.setScalar(Math.max(0.05, Math.min(10, pinchScale0 * d / pinchDist0)));
        } else if (k.length === 1 && placed) {
          modelGroup.rotation.y += (touches[k[0]].x - lastX) * 0.008;
          lastX = touches[k[0]].x;
        }
      }, { passive: true });

      overlay.addEventListener('touchend', e => {
        for (const t of e.changedTouches) delete touches[t.identifier];
        if (Object.keys(touches).length < 2) pinchDist0 = 0;
      }, { passive: true });

      // ── 7. Close button ──
      function doClose(e) {
        if (e) { e.preventDefault(); e.stopPropagation(); }
        log('Close tapped');
        try { session.end(); } catch (ex) { log('session.end error: ' + ex.message); doCleanup(); }
      }
      closeBtn.ontouchstart = doClose;
      closeBtn.onclick = doClose;

      // ── 8. Cleanup ──
      let cleaned = false;
      function doCleanup() {
        if (cleaned) return;
        cleaned = true;
        log('Cleanup');
        try { renderer.setAnimationLoop(null); } catch (e) {}
        try { renderer.domElement.remove(); } catch (e) {}
        try { renderer.dispose(); } catch (e) {}
        scene.traverse(o => {
          if (o.geometry) o.geometry.dispose();
          if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose());
        });
        viewerEl.style.display = '';
        overlay.classList.remove('active');
        guideText.parentElement.style.opacity = '';
        guideText.parentElement.style.transition = '';
        closeBtn.ontouchstart = null;
        closeBtn.onclick = null;
        cleanupFn = null;
      }
      cleanupFn = doCleanup;

      // ── 9. Render loop — START IMMEDIATELY so XR session stays alive ──
      renderer.setAnimationLoop(function (ts, frame) {
        if (!placed && frame && hitTestSource) {
          const ref = renderer.xr.getReferenceSpace();
          const results = frame.getHitTestResults(hitTestSource);
          if (results.length > 0) {
            const pose = results[0].getPose(ref);
            if (pose) {
              reticle.visible = true;
              reticle.matrix.fromArray(pose.transform.matrix);
              hitCount++;
              if (hitCount === 1) log('First surface detected');
              if (modelLoaded && hitCount === 1) guideText.textContent = 'Tap to place model here';
            }
          } else {
            reticle.visible = false;
          }
        }
        renderer.render(scene, camera);
      });
      log('Render loop started');

      // ── 10. Load model AFTER render loop is running (non-blocking) ──
      log('Fetching ' + modelUrl.split('/').pop() + '…');

      fetch(modelUrl).then(resp => {
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        log('Fetch OK, reading bytes…');
        return resp.arrayBuffer();
      }).then(buffer => {
        log('Got ' + (buffer.byteLength / 1048576).toFixed(1) + ' MB, parsing GLB…');
        const gltfLoader = new GLTFLoader();
        return new Promise((resolve, reject) => {
          gltfLoader.parse(buffer, '', resolve, reject);
        });
      }).then(gltf => {
        const model = gltf.scene;
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        const scale = 0.4 / maxDim;
        model.scale.setScalar(scale);
        model.position.set(-center.x * scale, -box.min.y * scale, -center.z * scale);
        modelGroup.add(model);
        modelLoaded = true;
        log('Model ready! Tap floor to place');
        guideText.textContent = reticle.visible ? 'Tap to place model here' : 'Point at floor, tap to place';
      }).catch(err => {
        log('FAIL: ' + (err.message || err));
        guideText.textContent = 'Model failed — tap X to exit';
      });

      // ── 11. Session end ──
      return new Promise(resolve => {
        session.addEventListener('end', () => { log('Session ended'); doCleanup(); resolve(); });
      });
    };

    // Safety net: clean up if page navigates or visibility changes
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && cleanupFn) cleanupFn();
    });
  </script>
</body>
</html>
