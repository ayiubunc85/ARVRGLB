<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f5f5f7">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>AR Viewer</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
    }
  }
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    model-viewer {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background-color: #f5f5f7;
      --poster-color: #f5f5f7;
      --progress-bar-color: #4361ee;
      --progress-bar-height: 3px;
    }
    model-viewer::part(default-ar-button) { display: none; }

    .back-btn {
      position: fixed; top: 12px; left: 12px;
      top: max(12px, env(safe-area-inset-top));
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(0,0,0,0.06); border: none;
      display: none; align-items: center; justify-content: center;
      cursor: pointer; z-index: 15;
    }
    .back-btn.visible { display: flex; }
    .back-btn:active { background: rgba(0,0,0,0.12); }
    .back-btn svg { width: 20px; height: 20px; fill: none; stroke: #1d1d1f; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .ar-button {
      position: fixed; bottom: 28px; right: 20px;
      bottom: max(28px, env(safe-area-inset-bottom));
      width: 56px; height: 56px; border-radius: 50%;
      background: #4361ee; border: none;
      box-shadow: 0 4px 16px rgba(67,97,238,0.35); z-index: 20;
      display: none; align-items: center; justify-content: center; cursor: pointer;
    }
    .ar-button:active { transform: scale(0.92); }
    .ar-button.visible { display: flex; }
    .ar-button svg { width: 28px; height: 28px; fill: none; stroke: white; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .loading-screen {
      position: fixed; inset: 0; background: #f5f5f7;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 100; transition: opacity 0.4s ease;
    }
    .loading-screen.hidden { opacity: 0; pointer-events: none; }

    .spinner { width: 48px; height: 48px; border: 3px solid rgba(0,0,0,0.08); border-top-color: #4361ee; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-status { margin-top: 20px; font-size: 14px; color: rgba(0,0,0,0.45); text-align: center; }
    .progress-bar { width: 180px; height: 3px; background: rgba(0,0,0,0.08); border-radius: 2px; margin-top: 16px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: #4361ee; border-radius: 2px; transition: width 0.3s ease; }

    .info-bar {
      position: fixed; top: 0; left: 0; right: 0; padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
      background: linear-gradient(to bottom, rgba(255,255,255,0.85), transparent);
      display: flex; align-items: center; justify-content: space-between;
      z-index: 10; opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
    }
    .info-bar.visible { opacity: 1; pointer-events: auto; }
    .model-name { font-size: 15px; font-weight: 600; color: #1d1d1f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; }
    .model-size { font-size: 12px; color: rgba(0,0,0,0.45); }

    .no-ar-notice {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,0.9); backdrop-filter: blur(12px);
      border-radius: 12px; padding: 14px 24px; font-size: 13px;
      color: rgba(0,0,0,0.6); text-align: center; z-index: 20;
      max-width: 90%; display: none; line-height: 1.4;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .no-ar-notice.visible { display: block; }

    .error-screen {
      position: fixed; inset: 0; background: #f5f5f7; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      padding: 32px; text-align: center; z-index: 100;
    }
    .error-screen.visible { display: flex; }
    .error-icon { width: 56px; height: 56px; border-radius: 50%; background: rgba(239,68,68,0.1); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; font-size: 24px; }
    .error-screen h2 { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: #1d1d1f; }
    .error-screen p { font-size: 14px; color: rgba(0,0,0,0.5); max-width: 300px; line-height: 1.5; }
    .retry-btn { margin-top: 24px; background: #4361ee; color: #fff; border: none; border-radius: 10px; padding: 12px 28px; font-size: 15px; font-weight: 600; cursor: pointer; }

    /* ── AR Overlay (dom-overlay root during WebXR) ── */
    #arOverlay {
      position: fixed; inset: 0; z-index: 200; display: none;
      pointer-events: none;
    }
    #arOverlay.active { display: block; }

    /* ── AR Top bar: close + guide ── */
    .ar-top-bar {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top));
      display: flex; align-items: center; gap: 10px;
      pointer-events: none; z-index: 210;
    }
    .ar-close-btn {
      width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255,255,255,0.25);
      color: white; font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; pointer-events: auto;
    }
    .ar-close-btn:active { background: rgba(0,0,0,0.75); }
    .ar-guide-pill {
      flex: 1; text-align: center;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(12px);
      border-radius: 20px; padding: 10px 16px;
      font-size: 13px; color: rgba(255,255,255,0.9);
      transition: opacity 0.8s ease;
    }
    .ar-guide-pill.fade-out { opacity: 0; pointer-events: none; }

    /* ── AR bottom-sheet menu ── */
    .ar-menu-toggle {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      bottom: max(16px, env(safe-area-inset-bottom));
      height: 36px; border-radius: 18px; padding: 0 18px;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255,255,255,0.25);
      color: white; font-size: 12px; font-weight: 500; z-index: 215;
      display: none; align-items: center; gap: 6px;
      cursor: pointer; pointer-events: auto;
      transition: background 0.2s, opacity 0.25s ease, transform 0.25s ease;
    }
    .ar-menu-toggle.visible { display: flex; }
    .ar-menu-toggle.open { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(10px); }
    .ar-menu-toggle:active { background: rgba(0,0,0,0.75); }
    .ar-menu-toggle svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
    .ar-menu-toggle .scale-pill { font-variant-numeric: tabular-nums; }

    .ar-menu-panel {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(20px);
      border-radius: 20px 20px 0 0; padding: 10px 12px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      pointer-events: auto; z-index: 214;
      display: flex; flex-direction: column; gap: 6px;
      transform: translateY(100%); opacity: 0;
      pointer-events: none;
      transition: transform 0.3s ease, opacity 0.2s ease;
    }
    .ar-menu-panel.open { transform: translateY(0); opacity: 1; pointer-events: auto; }

    .ar-menu-close-bar {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 6px 0 4px; cursor: pointer; color: rgba(255,255,255,0.6);
    }
    .ar-menu-close-bar .close-scale { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.85); font-variant-numeric: tabular-nums; }
    .ar-menu-close-bar svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; opacity: 0.5; }

    .ar-menu-section { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .ar-menu-section .section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; color: rgba(255,255,255,0.35); width: 100%; padding-left: 2px; }

    .ar-menu-btn {
      display: flex; align-items: center; justify-content: center;
      padding: 7px 0; border-radius: 8px;
      background: rgba(255,255,255,0.08); border: none; color: rgba(255,255,255,0.8);
      font-size: 12px; font-weight: 500; cursor: pointer;
      transition: background 0.15s; flex: 1; min-width: 0;
    }
    .ar-menu-btn:active { background: rgba(255,255,255,0.18); }
    .ar-menu-btn.active { background: rgba(67,97,238,0.7); color: white; font-weight: 600; }
    .ar-scale-btn { font-variant-numeric: tabular-nums; }
    .ar-btn-reset {
      background: rgba(67,97,238,0.3); color: white; font-weight: 600;
      padding: 7px 14px; border-radius: 8px; border: none; font-size: 12px; cursor: pointer;
    }
    .ar-btn-reset:active { background: rgba(67,97,238,0.5); }

    .ar-scale-row { display: flex; gap: 4px; }
    .ar-light-row { display: flex; gap: 4px; align-items: center; }
    .ar-light-row .ar-menu-btn { flex: 0 0 auto; padding: 7px 14px; }

    .ar-light-rotate { display: flex; align-items: center; gap: 4px; flex: 1; }
    .ar-light-rotate button {
      width: 32px; height: 32px; border-radius: 6px; border: none;
      background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.8);
      font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .ar-light-rotate button:active { background: rgba(255,255,255,0.18); }
    .ar-light-rotate .angle { flex: 1; text-align: center; font-size: 12px; color: rgba(255,255,255,0.6); font-variant-numeric: tabular-nums; }
    .ar-slider-row { display: flex; align-items: center; gap: 6px; padding: 0 2px; }
    .ar-slider-row label { font-size: 10px; color: rgba(255,255,255,0.4); min-width: 44px; }
    .ar-slider-row input[type=range] { flex: 1; height: 3px; accent-color: #4361ee; }
    .ar-slider-row .val { font-size: 11px; color: rgba(255,255,255,0.6); min-width: 24px; text-align: right; font-variant-numeric: tabular-nums; }
  </style>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>
<body>

  <div class="loading-screen" id="loading">
    <div class="spinner"></div>
    <p class="loading-status" id="loadingStatus">Connecting…</p>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="error-screen" id="error">
    <div class="error-icon">!</div>
    <h2 id="errorTitle">Could not load model</h2>
    <p id="errorMessage">Check that your phone is on the same WiFi network as the host computer.</p>
    <button class="retry-btn" id="retryBtn">Try again</button>
  </div>

  <button class="back-btn" id="backBtn">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  </button>

  <div class="info-bar" id="infoBar">
    <span class="model-name" id="modelName"></span>
    <span class="model-size" id="modelSize"></span>
  </div>

  <div class="no-ar-notice" id="noArNotice"></div>

  <button class="ar-button" id="arBtn">
    <svg viewBox="0 0 24 24">
      <path d="M12 2l6 3.5v5L12 14 6 10.5v-5L12 2z"/>
      <path d="M12 14v8"/>
      <path d="M18 10.5l-6 3.5"/>
      <path d="M6 10.5l6 3.5"/>
      <path d="M12 2v4"/>
      <path d="M18 5.5l-2.5-1.5"/>
      <path d="M6 5.5l2.5-1.5"/>
      <line x1="12" y1="22" x2="12" y2="24" stroke-width="1.2"/>
      <line x1="21" y1="8" x2="23" y2="7" stroke-width="1.2"/>
      <line x1="1" y1="7" x2="3" y2="8" stroke-width="1.2"/>
    </svg>
  </button>

  <model-viewer
    id="viewer"
    camera-controls touch-action="pan-y"
    auto-rotate auto-rotate-delay="2000" rotation-per-second="24deg"
    shadow-intensity="1" shadow-softness="0.8" exposure="1"
    environment-image="neutral" interaction-prompt="auto"
    bounds="tight"
    style="visibility: hidden; position: absolute;"
  ></model-viewer>

  <!-- AR DOM overlay (shown during WebXR session) -->
  <div id="arOverlay">
    <div class="ar-top-bar">
      <button class="ar-close-btn" id="arCloseBtn">&times;</button>
      <span class="ar-guide-pill" id="arGuideText">Move your phone slowly to scan the floor</span>
    </div>
    <button class="ar-menu-toggle" id="arMenuToggle">
      <span class="scale-pill" id="arScaleText">—</span>
      <svg viewBox="0 0 24 24" style="width:14px;height:14px;"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="ar-menu-panel" id="arMenuPanel">
      <div class="ar-menu-close-bar" id="arMenuClose">
        <span class="close-scale" id="arScaleTextPanel">—</span>
        <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <!-- Scale header + reset -->
      <div class="ar-menu-section" style="justify-content:space-between;">
        <button class="ar-btn-reset" id="arResetBtn">Reset</button>
      </div>
      <!-- Percentage row -->
      <div class="ar-menu-section">
        <span class="section-label">Scale</span>
        <div class="ar-scale-row" style="width:100%;">
          <button class="ar-menu-btn ar-scale-btn" data-pct="0.25">25%</button>
          <button class="ar-menu-btn ar-scale-btn" data-pct="0.50">50%</button>
          <button class="ar-menu-btn ar-scale-btn" data-pct="0.75">75%</button>
          <button class="ar-menu-btn ar-scale-btn" data-pct="1.0">100%</button>
        </div>
      </div>
      <!-- Architectural row -->
      <div class="ar-menu-section">
        <span class="section-label">Architectural</span>
        <div class="ar-scale-row" style="width:100%;">
          <button class="ar-menu-btn ar-scale-btn" data-scale="0.05">1:20</button>
          <button class="ar-menu-btn ar-scale-btn" data-scale="0.02">1:50</button>
          <button class="ar-menu-btn ar-scale-btn" data-scale="0.01">1:100</button>
          <button class="ar-menu-btn ar-scale-btn" data-scale="0.005">1:200</button>
        </div>
        <div class="ar-scale-row" style="width:100%;">
          <button class="ar-menu-btn ar-scale-btn" data-scale="0.002">1:500</button>
          <button class="ar-menu-btn ar-scale-btn" data-scale="0.001">1:1000</button>
          <button class="ar-menu-btn ar-scale-btn" data-scale="0.0008">1:1250</button>
        </div>
      </div>
      <!-- Lighting row -->
      <div class="ar-menu-section">
        <span class="section-label">Lighting</span>
        <div class="ar-light-row" style="width:100%;">
          <button class="ar-menu-btn ar-light-mode active" data-mode="auto" id="lightAutoBtn">Auto</button>
          <button class="ar-menu-btn ar-light-mode" data-mode="studio" id="lightStudioBtn">Studio</button>
        </div>
        <div id="lightStudioControls" style="display:none;width:100%;">
          <div class="ar-light-rotate">
            <button id="lightRotL">&#x25C0;</button>
            <span class="angle" id="lightAngleText">0°</span>
            <button id="lightRotR">&#x25B6;</button>
          </div>
          <div class="ar-slider-row">
            <label>Intensity</label>
            <input type="range" id="lightIntensity" min="0" max="500" value="120" step="10">
            <span class="val" id="lightIntVal">1.2</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── 3D Preview Logic ── -->
  <script>
    (function () {
      var viewer = document.getElementById('viewer');
      var loading = document.getElementById('loading');
      var loadingStatus = document.getElementById('loadingStatus');
      var progressFill = document.getElementById('progressFill');
      var errorEl = document.getElementById('error');
      var errorTitle = document.getElementById('errorTitle');
      var errorMessage = document.getElementById('errorMessage');
      var retryBtn = document.getElementById('retryBtn');
      var infoBar = document.getElementById('infoBar');
      var modelNameEl = document.getElementById('modelName');
      var modelSizeEl = document.getElementById('modelSize');
      var arBtn = document.getElementById('arBtn');
      var backBtn = document.getElementById('backBtn');
      var noArNotice = document.getElementById('noArNotice');

      var pathParts = window.location.pathname.split('/').filter(Boolean);
      var modelId = decodeURIComponent(pathParts[pathParts.length - 1]);

      if (!modelId) { showError('No model specified', 'The URL is missing a model name.'); return; }

      var arIndex = pathParts.indexOf('ar');
      var basePath = arIndex > 0 ? '/' + pathParts.slice(0, arIndex).join('/') : '';
      var baseUrl = window.location.origin + basePath;
      var glbUrl = baseUrl + '/models/' + encodeURIComponent(modelId) + '.glb';
      var usdzUrl = baseUrl + '/models/' + encodeURIComponent(modelId) + '.usdz';

      // Pre-cache GLB buffer so AR doesn't re-download.
      // Also pre-parse the GLB JSON header to detect oversized site meshes
      // and remove bounds="tight" BEFORE model-viewer starts loading
      // (model-viewer bakes its viewport normalization from bounds at load time).
      window.__arModelUrl = glbUrl;
      window.__glbBufferPromise = fetch(glbUrl).then(function(r) { return r.ok ? r.arrayBuffer() : null; }).then(function(buf) {
        window.__glbBuffer = buf;
        if (buf && buf.byteLength > 20) {
          try {
            var dv = new DataView(buf);
            var jsonLen = dv.getUint32(12, true);
            var jsonStr = new TextDecoder().decode(new Uint8Array(buf, 20, jsonLen));
            var g = JSON.parse(jsonStr);
            if (g.meshes && g.accessors && g.nodes && g.scenes) {
              var boxes = [];
              function vn(ni, pt) {
                var nd = g.nodes[ni]; if (!nd) return;
                var nt = nd.translation || [0,0,0];
                var t = [pt[0]+nt[0], pt[1]+nt[1], pt[2]+nt[2]];
                if (nd.mesh != null) {
                  var nmin=[Infinity,Infinity,Infinity], nmax=[-Infinity,-Infinity,-Infinity];
                  g.meshes[nd.mesh].primitives.forEach(function(p) {
                    var ac = g.accessors[p.attributes.POSITION];
                    if (!ac||!ac.min||!ac.max) return;
                    for(var a=0;a<3;a++){nmin[a]=Math.min(nmin[a],ac.min[a]+t[a]);nmax[a]=Math.max(nmax[a],ac.max[a]+t[a]);}
                  });
                  if (nmin[0]<Infinity) {
                    var d=Math.max(nmax[0]-nmin[0],nmax[1]-nmin[1],nmax[2]-nmin[2]);
                    boxes.push({ni:ni,min:nmin,max:nmax,maxDim:d});
                  }
                }
                (nd.children||[]).forEach(function(c){vn(c,t);});
              }
              (g.scenes[g.scene||0].nodes||[]).forEach(function(ni){vn(ni,[0,0,0]);});
              if (boxes.length >= 2) {
                boxes.sort(function(a,b){return a.maxDim-b.maxDim;});
                if (boxes[boxes.length-1].maxDim > boxes[0].maxDim * 5) {
                  var excludeNi = boxes[boxes.length-1].ni;
                  var g2 = JSON.parse(jsonStr);
                  g2.nodes.forEach(function(nd) {
                    if (nd.children) nd.children = nd.children.filter(function(c){return c!==excludeNi;});
                  });
                  g2.scenes.forEach(function(sc) {
                    if (sc.nodes) sc.nodes = sc.nodes.filter(function(n){return n!==excludeNi;});
                  });
                  var newJson = JSON.stringify(g2);
                  while (newJson.length % 4 !== 0) newJson += ' ';
                  var jsonBytes = new TextEncoder().encode(newJson);
                  var binOff = 20 + jsonLen;
                  var binLen = dv.getUint32(binOff, true);
                  var binData = new Uint8Array(buf, binOff + 8, binLen);
                  var total = 12 + 8 + jsonBytes.length + 8 + binLen;
                  var nb = new ArrayBuffer(total);
                  var nv = new DataView(nb);
                  var na = new Uint8Array(nb);
                  nv.setUint32(0, 0x46546C67, true);
                  nv.setUint32(4, 2, true);
                  nv.setUint32(8, total, true);
                  nv.setUint32(12, jsonBytes.length, true);
                  nv.setUint32(16, 0x4E4F534A, true);
                  na.set(jsonBytes, 20);
                  var bo = 20 + jsonBytes.length;
                  nv.setUint32(bo, binLen, true);
                  nv.setUint32(bo + 4, 0x004E4942, true);
                  na.set(binData, bo + 8);
                  window.__previewGlbUrl = URL.createObjectURL(new Blob([nb], {type:'model/gltf-binary'}));
                  window.__siteNodeExcluded = true;
                  console.log('Pre-parse: filtered GLB for preview (excluded node '+excludeNi+', site '+boxes[boxes.length-1].maxDim.toFixed(0)+' vs building '+boxes[0].maxDim.toFixed(0)+')');
                }
              }
            }
          } catch(e) { console.log('GLB pre-parse error:', e); }
        }
        return buf;
      }).catch(function() { return null; });

      // Back button — navigate to model dashboard (visible immediately)
      backBtn.classList.add('visible');
      backBtn.addEventListener('click', function () {
        var dashUrl = basePath + '/';
        window.location.href = dashUrl || '/';
      });

      startLoading();

      retryBtn.addEventListener('click', function () {
        errorEl.classList.remove('visible');
        loading.classList.remove('hidden');
        loading.style.display = '';
        startLoading();
      });

      // AR button — start custom WebXR AR
      arBtn.addEventListener('click', async function () {
        if (typeof window.startCustomAR === 'function') {
          arBtn.classList.remove('visible');
          infoBar.classList.remove('visible');
          backBtn.classList.remove('visible');
          try {
            await window.startCustomAR(glbUrl);
          } catch (err) {
            noArNotice.textContent = 'AR failed: ' + (err.message || err);
            noArNotice.classList.add('visible');
            setTimeout(function () { noArNotice.classList.remove('visible'); }, 5000);

        }
        // Light estimation: match virtual light to real environment (skipped in studio mode)
        if (lightMode === 'auto' && xrLightProbe && frame) {
          const estimate = frame.getLightEstimate(xrLightProbe);
          if (estimate) {
            const i = Math.max(
              estimate.primaryLightIntensity.x,
              estimate.primaryLightIntensity.y,
              estimate.primaryLightIntensity.z
            );
            dirLight.intensity = Math.min(i, 3.0);
            dirLight.color.setRGB(
              estimate.primaryLightIntensity.x / (i || 1),
              estimate.primaryLightIntensity.y / (i || 1),
              estimate.primaryLightIntensity.z / (i || 1)
            );
            const dir = estimate.primaryLightDirection;
            if (dir) dirLight.position.set(dir.x, dir.y, dir.z);
            const sh = estimate.sphericalHarmonicsCoefficients;
            if (sh && sh.length >= 9) {
              hemiLight.intensity = Math.min(Math.sqrt(sh[0]*sh[0] + sh[1]*sh[1] + sh[2]*sh[2]), 2.0);
            }
          }
        }
        renderer.render(scene, camera);
      });

      (window.__glbBufferPromise || fetch(modelUrl).then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.arrayBuffer();
      })).then(buffer => {
        if (!buffer) throw new Error('GLB download failed');
        const gltfLoader = new GLTFLoader();
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
        gltfLoader.setDRACOLoader(dracoLoader);
        return new Promise((resolve, reject) => {
          gltfLoader.parse(buffer, '', resolve, reject);
        });
      }).then(gltf => {
        const model = gltf.scene;
        model.updateMatrixWorld(true);
        // Collect per-mesh bounding boxes to find the primary content.
        // Models with a large site/context mesh (e.g. ar03) need framing
        // on the building, not the full scene extent.
        const meshBoxes = [];
        model.traverse(child => {
          if (child.isMesh) {
            const b = new THREE.Box3().setFromObject(child);
            const s = b.getSize(new THREE.Vector3());
            meshBoxes.push({ mesh: child, box: b, maxDim: Math.max(s.x, s.y, s.z) });
          }
        });
        meshBoxes.sort((a, b) => a.maxDim - b.maxDim);
        // If the largest mesh is >5x bigger than the median, treat it as
        // site context and frame on the remaining meshes instead.
        let frameBox = new THREE.Box3().setFromObject(model);
        if (meshBoxes.length >= 2) {
          const smallestDim = meshBoxes[0].maxDim;
          const largestDim = meshBoxes[meshBoxes.length - 1].maxDim;
          if (largestDim > smallestDim * 5) {
            frameBox = new THREE.Box3();
            meshBoxes.slice(0, -1).forEach(m => frameBox.union(m.box));
            console.log('AR framing: excluding oversized site mesh (' + largestDim.toFixed(1) + ' vs smallest ' + smallestDim.toFixed(1) + ')');
          }
        }
        const size = frameBox.getSize(new THREE.Vector3());
        const center = frameBox.getCenter(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        const scale = 0.4 / maxDim;
        initialScale = scale;
        maxScale = Math.max(1, 3.0 / (maxDim * scale));
        // Center on the primary content so modelGroup.scale pivots
        // around the visible building, not a far-off site mesh.
        model.position.set(-center.x, -frameBox.min.y, -center.z);
        const fittedWrapper = new THREE.Group();
        fittedWrapper.scale.setScalar(scale);
        fittedWrapper.add(model);
        console.log('AR model bounds:', {frame: {min: frameBox.min.toArray(), max: frameBox.max.toArray(), center: center.toArray()}, maxDim, scale});
        let totalVerts = 0;
        model.traverse(child => {
          if (child.isMesh && child.geometry) {
            const pos = child.geometry.getAttribute('position');
            if (pos) totalVerts += pos.count;
          }
        });
        const enableShadows = totalVerts < 500000;
        if (enableShadows) {
          model.traverse(child => { if (child.isMesh) child.castShadow = true; });
        }
        modelGroup.add(fittedWrapper);
        modelLoaded = true;
        guideText.textContent = reticle.visible ? 'Tap to place model here' : 'Point at floor, tap to place';
      }).catch(err => {
        console.error('AR model load failed:', err);
        guideText.textContent = 'Model failed to load — tap X to exit';
        guideText.classList.remove('fade-out');
      });

      return new Promise(resolve => {
        session.addEventListener('end', () => { doCleanup(); resolve(); });
      });
    };

    // Safety net: clean up if page navigates or visibility changes
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && cleanupFn) cleanupFn();
    });
  </script>
</body>
</html>
